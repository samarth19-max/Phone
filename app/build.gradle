plugins { id 'com.android.application' }

android {
    namespace 'dev.youbal.callrecphone'
    compileSdk 37

    defaultConfig {
        applicationId 'dev.youbal.callrecphone'
        minSdk 26
        targetSdk 37
        versionCode 5
        versionName '0.0.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }

    lint { abortOnError true }
}

dependencies {
    // Recorder sources are maintained in this repository under recorderlib/.
    implementation project(':recorderlib')
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}

configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.bouncycastle' && requested.name == 'bcprov-jdk15to18') {
            // callrec 0.3.0 currently requests 1.81; pin the patched release for CVE-2026-8763.
            useVersion '1.86'
            because 'Bouncy Castle versions before 1.85 are affected by CVE-2026-8763'
        }
    }
}
